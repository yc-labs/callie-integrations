version: '3.8'

services:
  callie-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - GOOGLE_CLOUD_PROJECT=yc-partners
    volumes:
      - ~/.config/gcloud:/home/app/.config/gcloud:ro  # Mount gcloud config for ADC
      - ./src:/app/src  # Mount source for hot reload during development
      - ./scripts:/app/scripts  # Mount scripts for workflow creation
    command: ["poetry", "run", "python", "-m", "callie.api.app"]
    restart: unless-stopped
    networks:
      - callie-network

  callie-ui:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://callie-api:8000/api/v1
    depends_on:
      - callie-api
    restart: unless-stopped
    networks:
      - callie-network

networks:
  callie-network:
    driver: bridge 